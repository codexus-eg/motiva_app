workflows:
  motiva-ios-testflight-workflow:
    name: Motiva iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # هذا هو المفتاح السحري لتعطيل SPM
      FLUTTER_SKIP_SWIFT_PACKAGE_MANAGER: "true"

    ios_signing:
      provisioning_profiles:
        - motiva_Manual_Profile
      certificates:
        - ios_cert_manual

    scripts:
      - name: Clean Project
        script: |
          flutter clean
          flutter pub get

      - name: Prepare iOS Environment
        script: |
          cd ios
          # حذف أي ملفات قد تحفز محاولة الـ SPM
          rm -rf Package.swift
          rm -rf Packages
          rm -rf Pods
          rm -rf Podfile.lock

          # تثبيت الـ Pods إجبارياً
          pod install
          cd ..

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          # البناء باستخدام إعدادات تعتمد فقط على CocoaPods
          flutter build ipa --release --no-codesign --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
