workflows:
  motiva-ios-testflight-workflow:
    name: Motiva iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: 15.4
      cocoapods: default
      vars:
        FLUTTER_SKIP_SWIFT_PACKAGE_MANAGER: "true"
      ios_signing:
        provisioning_profiles:
          - motiva_Manual_Profile
        certificates:
          - ios_cert_manual

    scripts:
      - name: Clean Project
        script: |
          flutter clean
          flutter pub get

      - name: Force Disable SPM and Clean Cache
        script: |
          find ~/.pub-cache -name "Package.swift" -type f -delete || true
          find $FLUTTER_ROOT/.pub-cache -name "Package.swift" -type f -delete || true

          python3 -c "
          import os
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('attributes = {', 'attributes = { DisableSwiftPackageIntegration = YES; ')
              with open(path, 'w') as f:
                  f.write(content)
          "

      - name: Prepare iOS Environment
        script: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install
          cd ..

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --no-codesign --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
